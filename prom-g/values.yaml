kube-prometheus-stack:
  prometheus:
    enabled: true
    service:
      type: NodePort
      nodePort: 32001
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false 
      podMonitorSelectorNilUsesHelmValues: false
      # -- Reduce global scrape interval so new targets are picked up
      # faster by KEDA autoscaling. Default is 1m (Prometheus built-in).
      scrapeInterval: 15s
      # -- Rule evaluation interval; should match or be close to scrapeInterval.
      evaluationInterval: 15s

  grafana:
    enabled: true
    service:
      type: NodePort
      nodePort: 32002
    # Plugins to install in Grafana
    plugins: []
    # Provision a sample datasource via datasources.yaml content
    # datasources:
    #   datasources.yaml:
    #     apiVersion: 1
    #     datasources:
    #       - name: Prometheus
    #         type: prometheus
    #         url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local
    #         access: proxy
    # Dashboard sidecar (Method B): enable and configure label search
    sidecar:
      dashboards:
        enabled: true
        # sidecar looks for ConfigMaps with key: <label>: "<labelValue>"
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
    # Persist Grafana data (dashboards, settings, alerts) in a PVC
    persistence:
      enabled: true
      size: 10Gi
      # storageClassName: ""
