# =============================================================================
# Developer Copilot — Sandbox Values (2x DGX Spark Nodes)
# =============================================================================
# Optimized for 2x DGX Spark nodes, each with 128GB Unified Memory and
# InfiniBand mlx5_0:1 interconnect.
#
# Node layout:
#   Node 1 (dgx-spark-1): LiteLLM, llm-d, TP=1 models, LWS Leader for TP=2
#   Node 2 (dgx-spark-2): LWS Worker for TP=2 models
# =============================================================================

global:
  clusterDomain: cluster.local
  registry: docker.io
  imagePullPolicy: IfNotPresent
  labels:
    app.kubernetes.io/part-of: llmd-stack

# =============================================================================
# LiteLLM — Lightweight for sandbox
# =============================================================================
litellm:
  enabled: true
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-latest
  replicas: 1
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  modelAliases:
    code-fast: "8001"
    code-agent: "8002"
    code-reasoning: "8003"
    code-long-context: "8004"
  routerSettings:
    routing_strategy: least-busy
    health_check_interval: 15
    allowed_fails: 3
    num_retries: 3
    fallbacks:
      - code-fast: [code-agent]
  drop_params: true
  extraEnv:
    LITELLM_LOG: "INFO"
    DATABASE_URL: ""


# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: vllm/vllm-openai
    tag: latest
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
    VLLM_USE_V1: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    GLOO_SOCKET_IFNAME: enp1s0f0np0  
    NCCL_SOCKET_IFNAME: enp1s0f0np0
    UCX_NET_DEVICES: enp1s0f0np0
    OMPI_MCA_btl_tcp_if_include: enp1s0f0np0
    TP_SOCKET_IFNAME: enp1s0f0np0
    NCCL_IB_HCA: rocep1s0f0,roceP2p1s0f0    # both halves for full 200 Gb/s
    NCCL_IB_DISABLE: 0
    NCCL_IGNORE_CPU_AFFINITY: 1
    TORCH_DISTRIBUTED_DEBUG: INFO
    NCCL_DEBUG: INFO
    NCCL_ASYNC_ERROR_HANDLING: 1
  modelStorage:
    storageClass: ""
    size: 100Gi
    mountPath: /models
    # -- Host path for Hugging Face model cache.
    # Shares the host's ~/.cache/huggingface so models are downloaded once.
    # NOTE: Kubernetes does not expand ~ — use the absolute path, e.g.:
    #   /home/trevor/.cache/huggingface
    # or the Docker root:
    #   /root/.cache/huggingface
    hostPath: /home/trevor/.cache/huggingface

# =============================================================================
# TP=1 Models — Fit within 128GB Unified Memory per DGX Spark node
# =============================================================================
modelsTp1:
  # -- code-fast: GLM5-2B chat, very lightweight, fits easily
  - name: code-fast
    port: 8001
    model: THUDM/glm5-2-chat
    tensorParallelSize: 1
    pipelineParallelSize: 1
    maxModelLen: 32768
    gpuMemoryUtilization: 0.85
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1
    nodeSelector:
      kubernetes.io/hostname: dgx-spark-1
    affinity: {}
    tolerations: []
    extraEnv: {}

  # -- code-agent: Qwen3.6-7B, fits comfortably on one DGX Spark GPU
  - name: code-agent
    port: 8002
    model: Qwen/Qwen3.6-7B-Instruct
    tensorParallelSize: 1
    pipelineParallelSize: 1
    maxModelLen: 65536
    gpuMemoryUtilization: 0.85
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1
    nodeSelector:
      kubernetes.io/hostname: dgx-spark-1
    affinity: {}
    tolerations: []
    extraEnv: {}

# =============================================================================
# TP=2 Models — Split across 2x DGX Spark nodes via LWS
# =============================================================================
modelsTp2:
  # -- code-reasoning: DeepSeek-R1-Distill-Qwen-7B, TP=2 across nodes
  - name: code-reasoning
    port: 8003
    model: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    tensorParallelSize: 2
    pipelineParallelSize: 1
    maxModelLen: 32768
    gpuMemoryUtilization: 0.85
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1
    leader:
      nodeSelector:
        kubernetes.io/hostname: dgx-spark-1
      nodeName: dgx-spark-1
    worker:
      nodeSelector:
        kubernetes.io/hostname: dgx-spark-2
      nodeName: dgx-spark-2
    extraEnv:
      VLLM_ENABLE_V1_MULTIPROCESSING: "1"

  # -- code-long-context: Qwen2.5-7B-1M, TP=2 across nodes for long context
  - name: code-long-context
    port: 8004
    model: Qwen/Qwen2.5-7B-Instruct-1M
    tensorParallelSize: 2
    pipelineParallelSize: 1
    maxModelLen: 1000000
    gpuMemoryUtilization: 0.85
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 1
      limits:
        nvidia.com/gpu: 1
    leader:
      nodeSelector:
        kubernetes.io/hostname: dgx-spark-1
      nodeName: dgx-spark-1
    worker:
      nodeSelector:
        kubernetes.io/hostname: dgx-spark-2
      nodeName: dgx-spark-2
    extraEnv:
      VLLM_ENABLE_V1_MULTIPROCESSING: "1"
