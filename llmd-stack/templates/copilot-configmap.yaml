
{{- if .Values.models }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llmd-stack.fullname" . }}-copilot
  labels:
    {{- include "llmd-stack.litellm.labels" . | nindent 4 }}
data:
  copilot.json: |
    [
      {
        "name": "LiteLLM",
        "vendor": "customendpoint",
        "apiType": "chat-completions",
        "models": [
{{- $first := true }}
{{- range $model := .Values.models }}
{{- if $model.enabled }}
{{- if not $first }},{{ end }}
          {
            "id": "{{ $model.model }}",
            "name": "{{ $model.model }}",
{{- if $.Values.global.externalUrl }}
            "url": "{{ $.Values.global.externalUrl }}/v1",
{{- else }}
            "url": "http://{{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}{{ if gt (int $model.nodes) 1 }}-svc{{ end }}:{{ $model.port }}/v1",
{{- end }}
            "toolCalling": true,
            "vision": false,
            "maxInputTokens": {{ default 65536 $model.maxModelLen }},
            "maxOutputTokens": 16000
          }
{{- $first = false }}
{{- end }}
{{- end }}

        ]
      }
    ]
{{- end }}
