{{- if .Values.litellm.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llmd-stack.fullname" . }}-litellm
  labels:
    {{- include "llmd-stack.litellm.labels" . | nindent 4 }}
data:
  config.yaml: |
    # =========================================================================
    # LiteLLM Proxy Configuration
    # Generated by Helm — {{ include "llmd-stack.fullname" . }}
    # =========================================================================

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      otel: false
      max_request_size_mb: 100
      allow_requests_on_db_error: true
      store_model_in_db: false
      drop_params: "{{ .Values.litellm.drop_params }}"
      default_litellm_params:
        drop_params: "{{ .Values.litellm.drop_params }}"
      environment_variables:
  {{ toYaml .Values.litellm.environment_variables | nindent 8 }}
      health_check_interval: {{ .Values.litellm.routerSettings.health_check_interval }}

    router_settings:
      routing_strategy: {{ .Values.litellm.routerSettings.routing_strategy }}
      allowed_fails: {{ .Values.litellm.routerSettings.allowed_fails }}
      num_retries: {{ .Values.litellm.routerSettings.num_retries }}
      fallbacks:
{{ toYaml .Values.litellm.routerSettings.fallbacks | indent 8 }}

    litellm_settings:
      drop_params: "{{ .Values.litellm.drop_params }}"
      set_verbose: false
      request_timeout: {{ .Values.global.defaultRequestTTL }}
      num_retries: {{ .Values.litellm.routerSettings.num_retries }}
      retry_after: 5
      fallback: []
      cache: false
      require_auth_for_metrics_endpoint: false
      callbacks:
        - prometheus

    # =========================================================================
    # Model Definitions
    # Each model alias maps to a vLLM backend port.
    # The llm-d gateway sits in front of all vLLM instances on port 8000.
    # =========================================================================

    model_list:
      {{- $root := . }} 
      
      {{- range $model := .Values.models }}
      {{- if $model.enabled }}
      {{- $apiBase := include "llmd-stack.apiBasePath" $root }}
      - model_name: {{ $model.model }}
        litellm_params:
          model: openai/{{ $model.model }}
          {{- if $apiBase }}
          #  Route to the shared llm-d router / EPP service
          api_base: {{ $apiBase }}
          {{- else }}
          #  Route directly to the model's vLLM service
          api_base: http://{{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $root) }}{{ if gt (int $model.nodes) 1 }}-svc{{ end }}:{{ $model.port }}/v1
          {{- end }}
          api_key: {{ $root.Values.litellm.secret.master_key }}
          drop_params: {{ $root.Values.litellm.drop_params }}
          rpm: 1000
          tpm: 100000
          max_retries: 0
          timeout: {{ $.Values.global.defaultRequestTTL }}
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: false
          supports_tool_choice: true
          max_input_tokens: {{ $model.maxModelLen }}
      {{- end }}
      {{- end }}
{{- end }}
