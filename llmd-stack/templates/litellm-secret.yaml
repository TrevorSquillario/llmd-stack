{{- if and .Values.litellm.enabled .Values.litellm.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmd-stack.fullname" . }}-litellm
  labels:
    {{- include "llmd-stack.litellm.labels" . | nindent 4 }}
type: Opaque
stringData:
  master_key: {{ default (randAlphaNum 32) .Values.litellm.secret.master_key | quote }}
  salt_key: {{ default (randAlphaNum 32) .Values.litellm.secret.salt_key | quote }}
{{- end }}
