{{- /* =============================================================================
  HorizontalPodAutoscaler — scales LiteLLM based on CPU/memory utilization.
  Enabled when .Values.litellm.autoscaling.enabled is true.
  ============================================================================= */}}

{{- if and .Values.litellm.enabled .Values.litellm.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "llmd-stack.fullname" . }}-litellm
  labels:
    {{- include "llmd-stack.litellm.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "llmd-stack.fullname" . }}-litellm
  minReplicas: {{ .Values.litellm.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.litellm.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.litellm.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
    {{- with .Values.litellm.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ . }}
    {{- end }}
  {{- with .Values.litellm.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
