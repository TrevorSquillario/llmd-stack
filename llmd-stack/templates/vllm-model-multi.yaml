{{- range $model := .Values.modelsMultiNode }}
{{- if $model.enabled }}
---
# =============================================================================
# {{ $model.name }} — Multi-Node vLLM via LeaderWorkerSet (LWS)
# Tensor Parallelism: {{ $model.tensorParallelSize }} across {{ $model.nodes }} nodes
# Model: {{ $model.model }}
# Port: {{ $model.port }}
# =============================================================================

# --- Service (fronts the Leader pod) ---
# 1. THE HEADLESS SERVICE (For LWS internal pod-to-pod/NCCL communication)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}
  labels:
    {{- include "llmd-stack.model.labels" $ | nindent 4 }}
    app.kubernetes.io/model-name: {{ $model.name }}
    llm-d.ai/model: {{ $model.name }}
    llm-d.ai/role: {{ $model.role | default "decode" }}
    llm-d.ai/guide: {{ $model.guide | default "optimized-baseline" }}
    app.kubernetes.io/model-port: {{ $model.port | quote }}
    vllm/tensor-parallel-size: {{ $model.tensorParallelSize | quote }}
    vllm/multi-node: "true"
spec:
  publishNotReadyAddresses: true
  clusterIP: None  # <-- Crucial: This makes it Headless
  ports:
    - name: http
      port: {{ $model.port }}
      targetPort: http
      protocol: TCP
  selector:
    # We target all pods in this LWS group so they can discover each other
    leaderworkerset.sigs.k8s.io/name: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}

---
# 2. THE CLIENT-FACING SERVICE (For LiteLLM / Users to hit vLLM)
apiVersion: v1
kind: Service
metadata:
  # Appending "-svc" to avoid name collisions with the LWS headless service
  name: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}-svc
  labels:
    {{- include "llmd-stack.model.labels" $ | nindent 4 }}
    app.kubernetes.io/model-name: {{ $model.name }}
    llm-d.ai/model: {{ $model.name }}
    llm-d.ai/role: {{ $model.role | default "decode" }}
    llm-d.ai/guide: {{ $model.guide | default "optimized-baseline" }}
    app.kubernetes.io/model-port: {{ $model.port | quote }}
    vllm/tensor-parallel-size: {{ $model.tensorParallelSize | quote }}
    vllm/multi-node: "true"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $model.port }}
      targetPort: http
      protocol: TCP
  selector:
    # Routes client traffic ONLY to the active leader pod
    leaderworkerset.sigs.k8s.io/name: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}
    leaderworkerset.sigs.k8s.io/role: leader

---
# --- LeaderWorkerSet ---
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}
  labels:
    {{- include "llmd-stack.model.labels" $ | nindent 4 }}
    app.kubernetes.io/model-name: {{ $model.name }}
    llm-d.ai/model: {{ $model.name }}
    app.kubernetes.io/model-port: {{ $model.port | quote }}
    vllm/tensor-parallel-size: {{ $model.tensorParallelSize | quote }}
    vllm/multi-node: "true"
spec:
  replicas: {{ $model.replicas | default 1 }}

  leaderWorkerTemplate:
    size: {{ $model.nodes }}
    restartPolicy: RecreateGroupOnPodRestart
    # =========================================================================
    # Leader Template (Rank 0 — serves the API)
    # =========================================================================
    leaderTemplate:
      metadata:
        labels:
          {{- include "llmd-stack.model.labels" $ | nindent 10 }}
          app.kubernetes.io/model-name: {{ $model.name }}
          llm-d.ai/model: {{ $model.name }}
          llm-d.ai/role: {{ $model.role | default "decode" }}
          llm-d.ai/guide: {{ $model.guide | default "optimized-baseline" }}
          llm-d.ai/inferenceServing: "true" # <-- Forces EPP auto-discovery
          app.kubernetes.io/model-port: {{ $model.port | quote }}
          vllm/tensor-parallel-size: {{ $model.tensorParallelSize | quote }}
          vllm/multi-node: "true"
          leaderworkerset.sigs.k8s.io/role: leader
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "{{ $model.port }}"
          prometheus.io/path: "/metrics"
      spec:
        {{- with $model.imagePullSecrets }}
        imagePullSecrets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $model.leader }}
        {{- with .nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .nodeName }}
        nodeName: {{ .nodeName | quote }}
        {{- end }}
        {{- end }}
        {{- with $model.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $model.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        hostIPC: true
        hostPID: true
        subdomain: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: "32Gi"
          {{- include "llmd-stack.modelStorage.volume" $ | nindent 10 }}
        containers:
          - name: vllm
            image: "{{ $.Values.vllm.image.repository }}:{{ $.Values.vllm.image.tag }}"
            imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
            command:
              - "sh"
              - "-c"
              - >
                vllm serve {{ $model.model }}
                --disable-access-log-for-endpoints /health,/metrics,/v1/models
                --tensor-parallel-size {{ $model.tensorParallelSize }}
                --pipeline-parallel-size $(LWS_GROUP_SIZE)
                --max-model-len {{ $model.maxModelLen }}
                --gpu-memory-utilization {{ $model.gpuMemoryUtilization }}
                --port {{ $model.port }}
                --host 0.0.0.0
                --trust-remote-code
                --enable-prefix-caching
                --enable-chunked-prefill
                --nnodes $(LWS_GROUP_SIZE)
                --node-rank $(LWS_WORKER_INDEX)
                --master-addr $(LWS_LEADER_ADDRESS).svc.cluster.local
                {{- if $model.dtype }}
                --dtype {{ $model.dtype }}
                {{- end }}
                {{- if $model.extraArgs }}
                {{- range $model.extraArgs }}
                '{{ . }}'
                {{- end }}
                {{- end }}
            ports:
              - name: http
                containerPort: {{ $model.port }}
                protocol: TCP
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            env:
              {{- include "llmd-stack.model.env" (dict "model" $model "ctx" $) | nindent 14 }}
              - name: NCCL_CROSS_NODE
                value: "1"
              - name: CUDA_DEVICE_MAX_CONNECTIONS
                value: "1"
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              {{- include "llmd-stack.modelStorage.volumeMount" $ | nindent 14 }}
            resources:
              {{- toYaml $model.resources | nindent 14 }}
            livenessProbe:
              httpGet:
                path: /health
                port: {{ $model.port }}
              initialDelaySeconds: 180
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 6
            readinessProbe:
              httpGet:
                path: /health
                port: {{ $model.port }}
              initialDelaySeconds: 90
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 3
            startupProbe:
              httpGet:
                path: /health
                port: {{ $model.port }}
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 90

    # =========================================================================
    # Worker Template (Rank 1..N — compute-only, no API server)
    # =========================================================================
    workerTemplate:
      metadata:
        labels:
          {{- include "llmd-stack.model.labels" $ | nindent 10 }}
          app.kubernetes.io/model-name: {{ $model.name }}
          llm-d.ai/model: {{ $model.name }}
          llm-d.ai/role: {{ $model.role | default "decode" }}
          llm-d.ai/guide: {{ $model.guide | default "optimized-baseline" }}
          llm-d.ai/inferenceServing: "true" # <-- Forces EPP auto-discovery
          app.kubernetes.io/model-port: {{ $model.port | quote }}
          vllm/tensor-parallel-size: {{ $model.tensorParallelSize | quote }}
          vllm/multi-node: "true"
          leaderworkerset.sigs.k8s.io/role: worker
      spec:
        {{- with $model.imagePullSecrets }}
        imagePullSecrets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $model.worker }}
        {{- with .nodeSelector }}
        nodeSelector:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- if .nodeName }}
        nodeName: {{ .nodeName | quote }}
        {{- end }}
        {{- end }}
        {{- with $model.affinity }}
        affinity:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $model.tolerations }}
        tolerations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        hostIPC: true
        hostPID: true
        subdomain: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $) }}
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: "32Gi"
          {{- include "llmd-stack.modelStorage.volume" $ | nindent 10 }}
        containers:
          - name: vllm
            image: "{{ $.Values.vllm.image.repository }}:{{ $.Values.vllm.image.tag }}"
            imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
            command:
              - "sh"
              - "-c"
              - >
                vllm serve {{ $model.model }}
                --disable-access-log-for-endpoints /health,/metrics,/v1/models
                --tensor-parallel-size {{ $model.tensorParallelSize }}
                --pipeline-parallel-size $(LWS_GROUP_SIZE)
                --max-model-len {{ $model.maxModelLen }}
                --gpu-memory-utilization {{ $model.gpuMemoryUtilization }}
                --port {{ $model.port }}
                --host 0.0.0.0
                --trust-remote-code
                --enable-prefix-caching
                --enable-chunked-prefill
                --nnodes $(LWS_GROUP_SIZE)
                --node-rank $(LWS_WORKER_INDEX)
                --master-addr $(LWS_LEADER_ADDRESS).svc.cluster.local
                --headless
                {{- if $model.dtype }}
                --dtype {{ $model.dtype }}
                {{- end }}
                {{- if $model.extraArgs }}
                {{- range $model.extraArgs }}
                '{{ . }}'
                {{- end }}
                {{- end }}
            ports:
              - name: http
                containerPort: {{ $model.port }}
                protocol: TCP
            env:
              {{- include "llmd-stack.model.env" (dict "model" $model "ctx" $) | nindent 14 }}
              - name: NCCL_CROSS_NODE
                value: "1"
              - name: CUDA_DEVICE_MAX_CONNECTIONS
                value: "1"
            securityContext:
              capabilities:
                add: ["IPC_LOCK"]
            volumeMounts:
              - name: dshm
                mountPath: /dev/shm
              {{- include "llmd-stack.modelStorage.volumeMount" $ | nindent 14 }}
            resources:
              {{- toYaml $model.resources | nindent 14 }}
            # Workers do not serve the API, so no HTTP probes.
            # They rely on the leader's health for liveness.
            startupProbe:
              exec:
                command:
                  - nvidia-smi
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 30
---
{{- end }}
{{- end }}
