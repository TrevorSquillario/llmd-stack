{{- /* =============================================================================
  KEDA HTTP Add-on Interceptor Resources
  =============================================================================
  Renders per-model InterceptorRoute + external-push ScaledObject when
  .Values.kedaHttpInterceptor.enabled is true.

  Architecture:
    LiteLLM → KEDA HTTP Interceptor Proxy → llm-d Router (or direct vLLM) → vLLM

  The InterceptorRoute defines the host-based routing rule and concurrency
  target. The ScaledObject uses an external-push trigger to scale the vLLM
  Deployment based on HTTP concurrency measured by the interceptor.

  Prerequisites:
    - KEDA installed in the cluster
    - KEDA HTTP Add-on installed (keda-add-ons-http)
  ============================================================================= */}}

{{- if .Values.kedaHttpInterceptor.enabled }}
{{- $root := . }}
{{- $interceptorNs := .Values.kedaHttpInterceptor.namespace }}
{{- $scalerAddr := printf "%s.%s:%v" .Values.kedaHttpInterceptor.externalScaler.service .Values.kedaHttpInterceptor.externalScaler.namespace .Values.kedaHttpInterceptor.externalScaler.port }}
{{- $globalMin := .Values.kedaHttpInterceptor.scaling.minReplicaCount | default 0 }}
{{- $globalMax := .Values.kedaHttpInterceptor.scaling.maxReplicaCount | default 4 }}
{{- $globalCooldown := .Values.kedaHttpInterceptor.scaling.cooldownPeriod | default 300 }}
{{- $globalTarget := .Values.kedaHttpInterceptor.scaling.targetValue | default "5" }}

{{- range $model := .Values.models }}
{{- if $model.enabled }}
{{- $isMulti := gt (int $model.nodes) 1 }}
{{- $host := $model.kedaHttp.host | default (printf "%s.internal" $model.name) }}
{{- $targetValue := $model.kedaHttp.targetValue | default $globalTarget }}
{{- $minReplicas := $model.kedaHttp.minReplicaCount | default $globalMin }}
{{- $maxReplicas := $model.kedaHttp.maxReplicaCount | default $globalMax }}
{{- $cooldown := $model.kedaHttp.cooldownPeriod | default $globalCooldown }}

{{- /* Determine the target service for the InterceptorRoute */}}
{{- $targetSvc := "" }}
{{- $targetPort := 0 }}
{{- if index $root.Values "llm-d-router-standalone" "router" "enabled" }}
  {{- /* Route to llm-d router EPP service */}}
  {{- $targetSvc = printf "%s-epp" $root.Release.Name }}
  {{- $targetPort = 80 }}
{{- else }}
  {{- /* Route directly to the model's vLLM service */}}
  {{- $targetSvc = include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $root) }}
  {{- if $isMulti }}
    {{- $targetSvc = printf "%s-svc" $targetSvc }}
  {{- end }}
  {{- $targetPort = $model.port }}
{{- end }}

{{- /* InterceptorRoute name */}}
{{- $routeName := printf "%s-%s-route" (include "llmd-stack.fullname" $root) $model.name }}

---
# ---------------------------------------------------------------------------
# InterceptorRoute — KEDA HTTP Add-on v1beta1
# Defines host-based routing and concurrency scaling target for this model.
# The KEDA HTTP interceptor proxy uses this to route incoming requests and
# measure concurrency for the external-push ScaledObject.
# ---------------------------------------------------------------------------
apiVersion: http.keda.sh/v1beta1
kind: InterceptorRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "llmd-stack.model.labels" $root | nindent 4 }}
    app.kubernetes.io/model-name: {{ $model.name }}
    keda.sh/interceptor-route: "true"
spec:
  # -- Backend service to route traffic to
  target:
    service: {{ $targetSvc | quote }}
    port: {{ $targetPort }}
  # -- Host-based routing rule: requests with this Host header are routed
  # to the target service and drive autoscaling via the scaling metric.
  rules:
    - hosts:
        - {{ $host | quote }}
  # -- Concurrency-based scaling metric: scale when concurrent requests
  # per replica exceed this target value.
  scalingMetric:
    concurrency:
      targetValue: {{ $targetValue }}

---
# ---------------------------------------------------------------------------
# ScaledObject — KEDA v1alpha1 (external-push trigger)
# Scales the vLLM Deployment based on HTTP concurrency reported by the KEDA
# HTTP interceptor. Works alongside the Prometheus-based ScaledObject to
# provide both scale-to-zero (external-push) and queue-depth (Prometheus)
# scaling signals.
# ---------------------------------------------------------------------------
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ printf "%s-%s-http-scaler" (include "llmd-stack.fullname" $root) $model.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "llmd-stack.model.labels" $root | nindent 4 }}
    app.kubernetes.io/model-name: {{ $model.name }}
    keda.sh/scaler: external-push
    keda.sh/interceptor-route: {{ $routeName }}
spec:
  scaleTargetRef:
    {{- if $isMulti }}
    apiVersion: leaderworkerset.x-k8s.io/v1
    kind: LeaderWorkerSet
    {{- else }}
    apiVersion: apps/v1
    kind: Deployment
    {{- end }}
    name: {{ include "llmd-stack.modelResourceName" (dict "name" $model.name "ctx" $root) }}
  minReplicaCount: {{ $minReplicas }}
  maxReplicaCount: {{ $maxReplicas }}
  cooldownPeriod: {{ $cooldown }}
  pollingInterval: 15
  triggers:
    - type: external-push
      metadata:
        scalerAddress: {{ $scalerAddr | quote }}
        interceptorRoute: {{ $routeName }}
{{- end }}
{{- end }}
{{- end }}
