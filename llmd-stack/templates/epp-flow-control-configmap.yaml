{{- if index .Values "llm-d-router-standalone" "router" "enabled" }}
{{- $ttl := .Values.global.defaultRequestTTL | default 600 }}
# =============================================================================
# EPP Flow Control Plugins Config
# Rendered as a separate ConfigMap so Helm templates (e.g. defaultRequestTTL)
# are expanded — the sub-chart's pluginsCustomConfig is a literal string.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-flow-control-plugins
  labels:
    {{- include "llmd-stack.labels" . | nindent 4 }}
data:
  flow-control-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    featureGates:
      - flowControl
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: round-robin-fairness-policy
    - type: fcfs-ordering-policy
    - type: concurrency-detector
      parameters:
        maxConcurrency: 132
        concurrencyMode: requests
        headroom: 0.0
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
    flowControl:
      maxBytes: "10Gi"
      maxRequests: "1k"
      defaultRequestTTL: "{{ $ttl }}s"
      saturationDetector:
        pluginRef: concurrency-detector
      priorityBands:
      - priority: 100
        maxRequests: "500"
        fairnessPolicyRef: round-robin-fairness-policy
        orderingPolicyRef: fcfs-ordering-policy
      - priority: 0
        maxRequests: "200"
        fairnessPolicyRef: round-robin-fairness-policy
        orderingPolicyRef: fcfs-ordering-policy
      - priority: -10
        maxRequests: "50"
        fairnessPolicyRef: round-robin-fairness-policy
        orderingPolicyRef: fcfs-ordering-policy
{{- end }}
