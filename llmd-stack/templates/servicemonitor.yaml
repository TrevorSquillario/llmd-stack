{{- if .Values.servicemonitor.enabled }}
# ServiceMonitor for LiteLLM
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "llmd-stack.fullname" . }}-litellm
  labels:
    {{- include "llmd-stack.labels" . | nindent 4 }}
    release: {{ .Values.servicemonitor.prometheusReleaseName }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: litellm
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
---
# ServiceMonitor for vLLM
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "llmd-stack.fullname" . }}-vllm
  labels:
    {{- include "llmd-stack.labels" . | nindent 4 }}
    release: {{ .Values.servicemonitor.prometheusReleaseName }}
spec:
  selector:
    matchExpressions:
      - key: app.kubernetes.io/model-name
        operator: Exists
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
{{- end }}