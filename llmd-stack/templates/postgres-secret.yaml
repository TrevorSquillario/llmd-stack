{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmd-stack.fullname" . }}-postgres
  labels:
    {{- include "llmd-stack.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  # basic-auth keys expected by CloudNativePG for password secrets
  username: {{ .Values.postgres.postgresqlUsername | quote }}
  password: {{ .Values.postgres.postgresqlPassword | quote }}
  postgresqlUsername: {{ .Values.postgres.postgresqlUsername | quote }}
  postgresqlPassword: {{ .Values.postgres.postgresqlPassword | quote }}
  postgresqlDatabase: {{ .Values.postgres.postgresqlDatabase | quote }}
  postgresqlHost: {{ .Values.postgres.host | quote }}
  postgresqlPort: {{ .Values.postgres.service.port | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:%v/%s" .Values.postgres.postgresqlUsername .Values.postgres.postgresqlPassword (default (printf "%s-%s" .Release.Name "postgres") .Values.postgres.host) .Values.postgres.service.port .Values.postgres.postgresqlDatabase | quote }}
{{- end }}
