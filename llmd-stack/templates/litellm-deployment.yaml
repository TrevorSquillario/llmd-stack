{{- if .Values.litellm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmd-stack.fullname" . }}-litellm
  labels:
    {{- include "llmd-stack.litellm.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: 5
  replicas: {{ .Values.litellm.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "llmd-stack.litellm.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmd-stack.litellm.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/litellm-configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "llmd-stack.fullname" . }}-litellm
      {{- with .Values.litellm.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: setup-ui
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          command:
            - sh
            - -c
            - |
              cp -r /app/.venv/lib/python3.13/site-packages/litellm/proxy/_experimental/out/* /app/var/litellm/ui/
          volumeMounts:
            - name: ui-volume
              mountPath: /app/var/litellm/ui
            - name: assets-volume
              mountPath: /app/var/litellm/assets
      containers:
        - name: litellm
          image: "{{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "{{ .Values.litellm.service.port }}"
            - "--num_workers"
            - "4"
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: {{ .Values.litellm.service.port }}
              protocol: TCP
          env:
            - name: LITELLM_NON_ROOT
              value: "true"
            - name: LITELLM_UI_PATH
              value: "/app/var/litellm/ui"
            - name: LITELLM_ASSETS_PATH
              value: "/app/var/litellm/assets"
            - name: LITELLM_MIGRATION_DIR
              value: "/app/migrations"
            - name: PRISMA_BINARY_CACHE_DIR
              value: "/app/cache/prisma-python/binaries"
            - name: XDG_CACHE_HOME
              value: "/app/cache"
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llmd-stack.fullname" . }}-litellm
                  key: master_key
                  optional: true
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "llmd-stack.fullname" . }}-litellm
                  key: salt_key
                  optional: true
{{- if .Values.postgres.enabled }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "llmd-stack.fullname" . }}-postgres
                  key: DATABASE_URL
{{- else if .Values.litellm.extraEnv.DATABASE_URL }}
            - name: DATABASE_URL
              value: {{ .Values.litellm.extraEnv.DATABASE_URL | quote }}
{{- end }}
            - name: LITELLM_LOG
              value: {{ .Values.litellm.extraEnv.LITELLM_LOG | quote }}
            - name: PROMETHEUS_MULTIPROC_DIR # Required then num_workers > 1 for Prometheus metrics collection across workers
              value: "/prometheus_multiproc"
            - name: ENFORCE_PRISMA_MIGRATION_CHECK # Chart startup error fix: The table `public.LiteLLM_UserTable` does not exist in the current database.
              value: "true"
            #- name: DISABLE_SCHEMA_UPDATE # We're using the Helm PreSync hook for db updates
            #  value: "true"
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 15
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: ui-volume
              mountPath: /app/var/litellm/ui
            - name: assets-volume
              mountPath: /app/var/litellm/assets
            - name: cache
              mountPath: /app/cache
            - name: migrations
              mountPath: /app/migrations
            - name: prometheus-multiproc
              mountPath: /prometheus_multiproc
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/readiness
              port: {{ .Values.litellm.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: {{ .Values.litellm.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
      topologySpreadConstraints:
        - maxSkew: 1 
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "llmd-stack.litellm.labels" . | nindent 14 }}
      terminationGracePeriodSeconds: 120
      volumes:
        - name: config
          configMap:
            name: {{ include "llmd-stack.fullname" . }}-litellm
        - name: prometheus-multiproc
          emptyDir: {}
        - name: ui-volume
          emptyDir:
            sizeLimit: 100Mi
        - name: assets-volume
          emptyDir:
            sizeLimit: 10Mi
        - name: cache
          emptyDir:
            sizeLimit: 500Mi
        - name: migrations
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llmd-stack.fullname" . }}-litellm
  labels:
    {{- include "llmd-stack.litellm.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
