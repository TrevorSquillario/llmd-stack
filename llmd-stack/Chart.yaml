apiVersion: v2
name: llmd-stack
description: A Helm chart for deploying a multi-tenant, multi-model developer architecture for code generation with LiteLLM, llm-d, vLLM backends and open weights models.
type: application
version: 1.0.0
appVersion: "1.0.0"
icon: https://raw.githubusercontent.com/cncf/artwork/main/projects/llmd/icon/color/llmd-icon-color.svg
keywords:
  - copilot
  - llm
  - litemll
  - vllm
  - inference-gateway
  - ai
sources:
  - https://github.com/BerriAI/litellm
  - https://github.com/llm-d/llm-d
  - https://github.com/vllm-project/vllm
maintainers:
  - name: Trevor Squillario
    email: Trevor.Squillario@Dell.com
dependencies:
  - name: cloudnative-pg
    version: "0.29.0"
    repository: "https://cloudnative-pg.github.io/charts"
    condition: postgres.enabled
  #- name: llm-d-infra
  #  version: "1.4.0"
  #  repository: "https://llm-d-incubation.github.io/llm-d-infra/"
  - name: llm-d-router-standalone
    version: "v0.9.0"  
    repository: "oci://ghcr.io/llm-d/charts"
