# =============================================================================
# NVIDIA Network Operator Standalone Config
# =============================================================================
# Summary: Standalone values for deploying only the NVIDIA Network Operator
# (NVNO) components. Enables Node Feature Discovery (NFD), OFED (Mellanox)
# driver, and the RDMA shared device plugin. Disables SR-IOV. This file is
# used independently from the main llmd-stack chart to set up RDMA networking
# on DGX nodes before deploying model workloads.
# =============================================================================

nfd:
  enabled: true
sriovNetworkOperator:
  enabled: false
# NicClusterPolicy CR values:
deployCR: true
ofedDriver:
  deploy: true
 
 
rdmaSharedDevicePlugin:
  deploy: true

sriovDevicePlugin:
  deploy: false