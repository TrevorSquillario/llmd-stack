# =============================================================================
# Multi-Node Gemma 4 with RDMA + Autoscaling (DGX GB10)
# =============================================================================
# Summary: Multi-node deployment for google/gemma-4-26B-A4B-it across 2 DGX
# GB10 nodes with tensor parallelism (TP=2), RDMA interconnect, and KEDA
# autoscaling (1-2 replicas). Uses enforce-eager and reduced context (8K) to
# keep VRAM usage low for testing. Enables tool-calling, reasoning parser, and
# fp8 KV cache. Pins vllm:v0.25.1. Includes NVNO RDMA shared device plugin.
# =============================================================================

global:
  clusterDomain: cluster.local
  registry: docker.io
  imagePullPolicy: IfNotPresent
  labels:
    app.kubernetes.io/part-of: llmd-stack

# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: vllm/vllm-openai
    tag: v0.25.1
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
    GLOO_SOCKET_IFNAME: eth0
    NCCL_SOCKET_IFNAME: eth0
    UCX_NET_DEVICES: eth0
    OMPI_MCA_btl_tcp_if_include: eth0
    TP_SOCKET_IFNAME: eth0
    NCCL_IB_HCA: rocep1s0f0,roceP2p1s0f0    # both halves for full 200 Gb/s
    NCCL_IB_DISABLE: 0
    NCCL_IGNORE_CPU_AFFINITY: 1
    TORCH_DISTRIBUTED_DEBUG: INFO
    NCCL_DEBUG: INFO
    HF_XET_HIGH_PERFORMANCE: 1
  modelStorage:
    storageClass: ""
    #size: 100Gi
    mountPath: /root/.cache/huggingface
    # -- Host path for Hugging Face model cache.
    # Shares the host's ~/.cache/huggingface so models are downloaded once.
    # NOTE: Kubernetes does not expand ~ — use the absolute path, e.g.:
    #   /home/trevor/.cache/huggingface
    # or the Docker root:
    #   /root/.cache/huggingface
    hostPath: /home/trevor/.cache/huggingface
  autoscaling:
    # -- Prometheus server address for KEDA Prometheus scaler.
    # Used when autoscaling.keda=true on individual models.
    prometheusServerAddress: "http://dev-kube-prometheus-stack-prometheus.llmd-stack.svc:9090"

# =============================================================================
# Models — Multi-node with RDMA and autoscaling
# =============================================================================
models:
  - name: gemma-4-26b-a4b-it
    port: 8000
    model: google/gemma-4-26B-A4B-it
    nodes: 2
    tensorParallelSize: 2
    pipelineParallelSize: 1
    maxModelLen: 8192
    gpuMemoryUtilization: 0.38
    enabled: true
    resources:
      limits:
        cpu: "4"
        memory: "30Gi"
        nvidia.com/gpu: 1
        rdma/rdma_shared_device_a: "2"
      requests:
        cpu: "2"
        memory: "28Gi"
        nvidia.com/gpu: 1
        rdma/rdma_shared_device_a: "2"
    affinity: {}
    tolerations: []
    extraEnv: {}
    extraArgs:
      - "--max-num-seqs=4"
      - "--max-num-batched-tokens=8192"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=gemma4"
      - "--reasoning-parser=gemma4"
      - "--kv-cache-dtype=fp8"
      - "--default-chat-template-kwargs={\"enable_thinking\": true}"
      - "--enforce-eager" # Used for testing to keep VRAM down
    replicas: null # Using HPA for autoscaling, so replicas are managed by the HPA controller.
    # -- KEDA autoscaling — scale between 1-8 replicas based on vLLM metrics
    autoscaling:
      enabled: true
      keda: true # KEDA is preferred over Prometheus Adapter as it is being deprecated in favor of KEDA. With enabled: true and keda: false, you can still use Prometheus Adapter for autoscaling instead of KEDA.
      minReplicas: 1
      maxReplicas: 2 # 2 lws per node, 4 vllm instances
      # Scale out when average queue depth exceeds 5 pending requests
      # PromQL: sum(vllm:num_requests_waiting{model_name="{{ $model.model }}"})
      targetRequestsWaiting: "5"
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 30  # Waits 30s to ensure metric spike isn't a temporary blip
          policies:
            - type: Pods
              value: 1                    # Add at most 1 pod at a time
              periodSeconds: 30           # Every 30 seconds
            - type: Percent
              value: 100
              periodSeconds: 15
          selectPolicy: Min               # Pick the strictly smaller change to slow down scaling
        scaleDown:
          stabilizationWindowSeconds: 300 # Wait 5 mins before scaling down to prevent flapping
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30 

# =============================================================================
# NVIDIA Network Operator (NVNO) — RDMA Shared Device Plugin
# =============================================================================
nvno:
  rdmaSharedDevicePlugin:
    enabled: true
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_device_a",
            "rdmaHcaMax": 63,
            "selectors": {
              "vendors": [],
              "deviceIDs": [],
              "drivers": [],
              "ifNames": ["enp1s0f0np0", "enP2p1s0f0np0"],
              "linkTypes": []
            }
          }
        ]
      }

servicemonitor:
  enabled: true