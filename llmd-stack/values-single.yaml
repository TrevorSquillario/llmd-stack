# =============================================================================
# Single-Node Smoketest (1x DGX Spark)
# =============================================================================
# Summary: Minimal single-node deployment for basic smoke testing. Runs
# Qwen2.5-0.5B-Instruct (tiny model, fast to load) with 2 static replicas.
# No autoscaling, no RDMA, no Istio. Uses vllm:latest. Ideal for validating
# that the chart deploys correctly on a single DGX Spark node.
# =============================================================================

global:
  clusterDomain: cluster.local
  registry: docker.io
  imagePullPolicy: IfNotPresent
  labels:
    app.kubernetes.io/part-of: llmd-stack
  
# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: vllm/vllm-openai
    tag: latest
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
  modelStorage:
    storageClass: ""
    #size: 100Gi
    mountPath: /root/.cache/huggingface
    # -- Host path for Hugging Face model cache.
    # Shares the host's ~/.cache/huggingface so models are downloaded once.
    # NOTE: Kubernetes does not expand ~ — use the absolute path, e.g.:
    #   /home/trevor/.cache/huggingface
    # or the Docker root:
    #   /root/.cache/huggingface
    hostPath: /home/trevor/.cache/huggingface

# =============================================================================
# Models — Fit within 128GB Unified Memory per DGX Spark node
# =============================================================================
models:
  - name: qwen-2-5-05b-it
    port: 8000
    model: Qwen/Qwen2.5-0.5B-Instruct
    nodes: 1
    tensorParallelSize: 1
    pipelineParallelSize: 1
    maxModelLen: 512
    gpuMemoryUtilization: 0.8
    enabled: true
    resources:
      limits:
        cpu: "4"
        memory: "8Gi"
        nvidia.com/gpu: 1
      requests:
        cpu: "2"
        memory: "6Gi"
        nvidia.com/gpu: 1
    affinity: {}
    tolerations: []
    extraEnv: {}
    extraArgs:
      - "--max-num-seqs=4"
      - "--max-num-batched-tokens=8192"
      - "--enforce-eager" # Used for testing to keep VRAM down
    replicas: 2

servicemonitor:
  enabled: true

