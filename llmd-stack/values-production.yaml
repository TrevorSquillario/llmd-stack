# =============================================================================
# Developer Copilot — Production Values (NVIDIA GB200 NVL72 Cluster)
# =============================================================================
# Optimized for an NVIDIA GB200 NVL72 cluster with high-density Blackwell
# GPUs, multi-node NVLink domains, and high-speed InfiniBand fabric.
#
# This configuration deploys full-scale models with aggressive tensor
# parallelism and expert parallelism for MoE architectures.
# =============================================================================

global:
  clusterDomain: cluster.local
  registry: nvcr.io
  imagePullPolicy: Always
  labels:
    app.kubernetes.io/part-of: llmd-stack
    app.kubernetes.io/environment: production

# =============================================================================
# LiteLLM — Production-grade with HA
# =============================================================================
litellm:
  enabled: true
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-latest
  replicas: 3
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: "4"
      memory: "8Gi"
    limits:
      cpu: "8"
      memory: "16Gi"
  modelAliases:
    code-fast: "8001"
    code-agent: "8002"
    code-reasoning: "8003"
    code-long-context: "8004"
  routerSettings:
    routing_strategy: least-busy
    health_check_interval: 15
    allowed_fails: 5
    num_retries: 3
    fallbacks:
      - code-fast: [code-agent]
      - code-agent: [code-fast]
      - code-reasoning: [code-agent]
      - code-long-context: [code-reasoning]
  drop_params: true
  extraEnv:
    LITELLM_LOG: "INFO"
    DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm"
    LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
    LITELLM_SALT_KEY: "${LITELLM_SALT_KEY}"

# =============================================================================
# InfiniBand — NVL72 Fabric
# =============================================================================
infiniband:
  disable: "0"
  hca: "mlx5_0:1"
  socketIfname: "ib0"
  topologyFile: "/etc/nccl/topology.xml"

# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: nvcr.io/nvidia/vllm
    tag: v1.0.0
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
    VLLM_USE_V1: "1"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    VLLM_KV_CACHE_DTYPE: "fp8"
    VLLM_ATTENTION_BACKEND: "flash_attn"
    VLLM_CPU_KVCACHE_SPACE: "10"
  modelStorage:
    storageClass: nvme-storage
    size: 2000Gi
    mountPath: /models
    # -- Host path for model cache. Leave empty to use PVC in production.
    hostPath: ""

# =============================================================================
# TP=1 Models — Production dense models
# =============================================================================
modelsTp1:
  # -- code-fast: GLM5-2B chat, TP=2 for throughput on NVL72
  - name: code-fast
    port: 8001
    model: THUDM/glm5-2-chat
    tensorParallelSize: 2
    pipelineParallelSize: 1
    maxModelLen: 65536
    gpuMemoryUtilization: 0.92
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 2
      limits:
        nvidia.com/gpu: 2
    nodeSelector:
      nvidia.com/gpu.product: "NVIDIA-GB200"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - "{{ .name }}"
              topologyKey: kubernetes.io/hostname
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    extraEnv: {}

  # -- code-agent: Qwen3.6-27B NVFP4, TP=4 for production throughput
  - name: code-agent
    port: 8002
    model: nvidia/Qwen3.6-27B-NVFP4
    tensorParallelSize: 4
    pipelineParallelSize: 1
    maxModelLen: 131072
    gpuMemoryUtilization: 0.92
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 4
      limits:
        nvidia.com/gpu: 4
    nodeSelector:
      nvidia.com/gpu.product: "NVIDIA-GB200"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - "{{ .name }}"
              topologyKey: kubernetes.io/hostname
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    extraEnv:
      VLLM_FP4_ENABLED: "1"

# =============================================================================
# TP=2+ Models — Production MoE models with expert parallelism
# =============================================================================
modelsTp2:
  # -- code-reasoning: DeepSeek-V4-Flash, TP=4 with expert parallel
  - name: code-reasoning
    port: 8003
    model: deepseek-ai/DeepSeek-V4-Flash
    tensorParallelSize: 4
    pipelineParallelSize: 1
    maxModelLen: 65536
    gpuMemoryUtilization: 0.92
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 4
      limits:
        nvidia.com/gpu: 4
    leader:
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-GB200"
      nodeName: ""
    worker:
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-GB200"
      nodeName: ""
    extraEnv:
      VLLM_ENABLE_V1_MULTIPROCESSING: "1"
      VLLM_EP_PARAM_SIZE: "4"
      VLLM_ENABLE_EXPERT_PARALLEL: "1"
      VLLM_EP_LOAD_BALANCE: "round-robin"
      VLLM_MOE_LAYER_NUM: "61"
      VLLM_MOE_INTERMEDIATE_SIZE: "2048"
      VLLM_MOE_NUM_EXPERTS: "256"
      VLLM_MOE_TOP_K: "8"
      VLLM_MOE_NUM_SHARED_EXPERTS: "1"

  # -- code-long-context: MiniMax-M3, TP=8, 1M context
  - name: code-long-context
    port: 8004
    model: MiniMax-AI/MiniMax-M3
    tensorParallelSize: 8
    pipelineParallelSize: 1
    maxModelLen: 1000000
    gpuMemoryUtilization: 0.92
    dtype: bfloat16
    enabled: true
    resources:
      requests:
        nvidia.com/gpu: 8
      limits:
        nvidia.com/gpu: 8
    leader:
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-GB200"
      nodeName: ""
    worker:
      nodeSelector:
        nvidia.com/gpu.product: "NVIDIA-GB200"
      nodeName: ""
    extraEnv:
      VLLM_ENABLE_V1_MULTIPROCESSING: "1"
      VLLM_CPU_KVCACHE_SPACE: "20"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
