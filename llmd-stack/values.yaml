# =============================================================================
# Global Values (Default)
# =============================================================================
# Summary: Base/default values file for the llmd-stack Helm chart. Defines the
# full stack: LiteLLM proxy (with autoscaling, secrets, migration job), vLLM
# backend settings, model definitions (empty by default — override per env),
# NVIDIA Network Operator RDMA plugin, monitoring (ServiceMonitor), zero-trust
# NetworkPolicy, and PostgreSQL (CloudNativePG). All other values-*.yaml files
# override specific sections of this file for particular deployment scenarios.
# =============================================================================

global:
  # -- Cluster domain used for internal DNS resolution
  clusterDomain: cluster.local
  # -- Docker registry prefix for all images
  registry: docker.io
  # -- Image pull policy
  imagePullPolicy: IfNotPresent
  # -- Common labels applied to all resources
  labels:
    app.kubernetes.io/part-of: llmd-stack
  # -- External URL for the model endpoint. When set, the copilot ConfigMap will
  # use this as the model endpoint base URL (https://<externalUrl>/v1)
  # instead of the internal cluster service URLs.
  externalUrl: ""
  # -- Default request TTL (seconds) for the entire inference stack.
  # Drives the EPP Flow Control queue TTL, LiteLLM global request_timeout,
  # and LiteLLM per-model timeout. Increase for cold-start / scale-from-zero
  # scenarios where model loading takes longer than 60s.
  defaultRequestTTL: 600
  # -- Global autoscaling defaults (can be overridden per model)
  autoscaling:
    # -- Prometheus server address for KEDA Prometheus scaler.
    # Used when autoscaling.keda=true on individual models.
    # Default: kube-prometheus-stack-prometheus.monitoring.svc:9090
    prometheusServerAddress: "http://dev-kube-prometheus-stack-prometheus.llmd-stack.svc:9090"
    # -- Default HPA behavior for all models.
    # Individual models can override by setting model.autoscaling.behavior.
    defaultBehavior:
      scaleUp:
        stabilizationWindowSeconds: 0
        policies:
          - type: Pods
            value: 1
            periodSeconds: 15
          - type: Percent
            value: 100
            periodSeconds: 1
        selectPolicy: Min
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 30

# =============================================================================
# LiteLLM Proxy Settings
# =============================================================================
litellm:
  enabled: true
  image:
    repository: ghcr.io/berriai/litellm
    tag: v1.92.1
  replicas: 1
  service:
    type: NodePort
    port: 4000
    nodePort: 32020 # Must be between 30000-32767
  resources:
    limits:
      cpu: "4"
      memory: "12Gi"
    requests:
      cpu: "2"
      memory: "10Gi"
  # -- Model aliases map: alias -> backend port
  modelAliases:
    code-fast: "8001"
    code-agent: "8002"
    code-reasoning: "8003"
    code-long-context: "8004"
  routerSettings:
    routing_strategy: least-busy
    health_check_interval: 15
    allowed_fails: 3
    num_retries: 3
    fallbacks: []
  drop_params: true
  # -- Override the llm-d API base path. When set, takes precedence over the
  # auto-detected EPP or inference-gateway service URL.
  # Example: "http://custom-router.namespace.svc.cluster.local/v1"
  apiBasePath: ""
  # -- HorizontalPodAutoscaler configuration for LiteLLM
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 30
  # -- Additional environment variables for LiteLLM
  extraEnv:
    LITELLM_LOG: "INFO"
    #DATABASE_URL: "postgresql://<user>:<password>@<host>:<port>/<dbname>"  # Set to a PostgreSQL URL for external database server, not deployed by this chart.
  secret:
    # Create a Kubernetes Secret for LiteLLM credentials (master_key/salt_key)
    create: true
    # Optional: provide values to override generated keys. If empty, Helm will
    # generate random keys during template rendering.
    # WARNING: The defaults below are INSECURE and must be overridden in
    # production. Use strong random values, e.g.:
    #   master_key: "$(openssl rand -base64 32)"
    #   salt_key:   "$(openssl rand -base64 32)"
    master_key: "password"
    salt_key: "abc123"
  migrationJob:
    enabled: true
    backoffLimit: 4
    ttlSecondsAfterFinished: 120
    resources:
      limits:
        cpu: "500m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "512Mi"
    hooks:
      # Enabled by default for GitOps workflows (ArgoCD)
      argocd:
        enabled: false  # Generates: argocd.argoproj.io/hook: PreSync
      # Optional for native Helm workflows
      helm:
        enabled: true # Generates: helm.sh/hook: pre-install,pre-upgrade
        weight: "1"

# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: vllm/vllm-openai
    tag: latest
  # -- Shared environment variables for all vLLM instances
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
    VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    HF_XET_HIGH_PERFORMANCE: "1"
  # -- Persistent volume for model storage (shared across pods)
  modelStorage:
    storageClass: ""
    size: 200Gi
    mountPath: /models
    # -- Host path for model cache (e.g. ~/.cache/huggingface).
    # When set, uses a hostPath volume instead of a PVC, sharing the host's
    # Hugging Face cache so models don't need to be re-downloaded per pod.
    # Use an absolute path — Kubernetes does not expand ~.
    hostPath: ""
    # -- Mount the model storage volume as read-only.
    # When true, the volume is mounted read-only. Only use this if models
    # are pre-downloaded — vLLM will not be able to download models at startup.
    readOnly: false
  # -- Cache storage for AOT compilation artifacts (Triton, Inductor, FlashInfer).
  # When hostPath is set, mounts a hostPath volume at mountPath (default: /cache).
  # Set hostPath to "" (or omit) to disable. Example:
  #   cacheStorage:
  #     hostPath: /home/trevor/.cache/vllm
  #     mountPath: /cache
  cacheStorage:
    # -- Host path for AOT compilation artifacts (Triton, Inductor, FlashInfer).
    # When set, mounts a hostPath volume at mountPath.
    hostPath: ""
    # -- Mount path for cache storage inside the container.
    mountPath: /cache
    # -- Mount the cache volume as read-only.
    # When true, the volume is mounted read-only. Only use this if caches
    # are pre-compiled — vLLM will not be able to write artifacts at startup.
    readOnly: false

# =============================================================================
# Model Definitions
# =============================================================================
# Each model entry supports the following fields:
#   name, port, model, nodes, tensorParallelSize, pipelineParallelSize,
#   maxModelLen, gpuMemoryUtilization, enabled, replicas, resources,
#   nodeSelector, affinity, tolerations, extraEnv, extraArgs, dtype,
#   dshmSizeLimit (default: "16Gi" for single-node, "32Gi" for multi-node),
#   image (optional): { repository, tag } — overrides the global vllm.image
#     for this specific model. Either field can be omitted to inherit the
#     global default.
#   autoscaling (optional):
#     enabled: false
#     minReplicas: 1
#     maxReplicas: 5
#     keda: false              # Use KEDA ScaledObject instead of HPA
#     targetRequestsWaiting: "5"   # Queue depth threshold
#     # -- How often (seconds) KEDA polls Prometheus for the queue metric.
#     pollingInterval: 15
#     # -- How long (seconds) KEDA waits with zero queue before scaling
#     # the last replica down to zero. Default 3600 (1 hour).
#     cooldownPeriod: 3600
#     # -- Custom PromQL query for EPP Flow Control queue depth.
#     # When llm-d-router-standalone.router.enabled=true, the KEDA
#     # ScaledObject queries llm_d_epp_flow_control_queue_size by default.
#     # Override this if the metric label differs (e.g. pool name vs model
#     # name). Example:
#     #   eppMetricQuery: "sum(llm_d_epp_flow_control_queue_size{pool=\"my-pool\"})"
#     eppMetricQuery: ""
#     behavior: {}
#
#   The ScaledObject includes a second Prometheus trigger that queries
#   vllm:num_requests_running with threshold "1". This keeps the pod alive
#   while it is actively serving a request — the EPP queue depth drops to 0
#   as soon as a pod starts, but the running-requests trigger prevents the
#   cooldown timer from starting until the request completes.
#
# Single-node models (nodes: 1) render as a Deployment + ClusterIP Service.
# Multi-node models (nodes > 1) render as a LeaderWorkerSet + headless
# Service + client-facing Service. The templates branch on the `nodes` field.
models: []

# =============================================================================
# NVIDIA Network Operator (NVNO) — RDMA Shared Device Plugin
# =============================================================================
nvno:
  rdmaSharedDevicePlugin:
    enabled: false
    config: ""

# =============================================================================
# Monitoring Settings
# =============================================================================
servicemonitor:
  enabled: true
  # -- Prometheus release name used in the ServiceMonitor's release label
  prometheusReleaseName: dev-kube-prometheus-stack
  namespace: llmd-stack
  # -- Scrape interval for Prometheus metrics
  scrapeInterval: 10s

# =============================================================================
# NetworkPolicy — zero-trust network isolation
# =============================================================================
networkPolicy:
  # -- Enable NetworkPolicy resources for production network isolation.
  # When enabled, creates default-deny, allow-DNS, and component-specific
  # ingress/egress rules. Requires a CNI that supports NetworkPolicy.
  enabled: false

# =============================================================================
# PostgreSQL chart/cluster values (CloudNativePG cluster chart)
# =============================================================================
postgres:
  enabled: true
  namespace: llmd-stack
  host: test-litellm-db-cluster-rw
  # -- Cluster operation mode (standalone/replica/recovery)
  mode: standalone
  # -- PostgreSQL major version
  version:
    postgresql: "16"
  # -- Cluster-specific settings forwarded to the cluster subchart
  cluster:
    instances: 1
    storage:
      size: 8Gi
      storageClass: ""
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    postgresql:
      parameters: {}
  # -- Credentials used to build the DATABASE_URL secret (kept here for the secret template)
  # WARNING: The defaults below are INSECURE and must be overridden in production.
  postgresqlUsername: app
  postgresqlPassword: password
  postgresqlDatabase: litellm
  service:
    port: 5432

# =============================================================================
# llm-d Router Settings
# =============================================================================
llm-d-router-standalone:
  router:
    enabled: true
    extraServicePorts:
      - name: http
        port: 80
        protocol: TCP
        targetPort: 8081

    epp:
      replicas: 1
      flags:
        v: 2

      pluginsConfigFile: "../config-custom/flow-control-plugins.yaml"
      # pluginsCustomConfig is intentionally omitted — the flow-control plugins
      # config is rendered as a separate ConfigMap (epp-flow-control-configmap.yaml)
      # so Helm templates (e.g. global.defaultRequestTTL) are expanded.
      # Mounted at /config-custom (not /config, which is already a mount point
      # from the sub-chart's default plugins-config-volume). The pluginsConfigFile
      # uses ../config-custom/ to traverse from /config/ to /config-custom/.
      volumes:
        - name: flow-control-plugins
          configMap:
            name: epp-flow-control-plugins
      volumeMounts:
        - name: flow-control-plugins
          mountPath: /config-custom
          readOnly: true
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
        limits:
          memory: 16Gi

    inferencePool:
      failureMode: "FailOpen"

    modelServers:
      protocol: http
      matchLabels:
        llm-d.ai/guide: "optimized-baseline" # Label used to select model server pods for routing. Must match the label on the model server deployments.

    proxy:
      args:
        - "--service-node"
        - "envoy-sidecar"
        - "--log-level"
        - "warn"
        - "--concurrency"
        - "8"
        - "--drain-strategy"
        - "immediate"
        - "--drain-time-s"
        - "60"
        - "-c"
        - "/etc/envoy/envoy.yaml"
      resources:
        requests:
          cpu: "4"
          memory: 8Gi
        limits:
          memory: 16Gi

    #tracing:
    #  otelExporterEndpoint: "http://localhost:4317"
    #  sampling:
    #    sampler: "parentbased_traceidratio"
    #     samplerArg: "0.1"

# ============================================================================
# Gateway — Istio Gateway resource for external ingress
# ============================================================================
gateway:
  # -- Name of the Gateway resource
  name: ""
  # -- Gateway class name (e.g. "istio")
  gatewayClassName: "istio"
  # -- Whether to create a Gateway resource
  enabled: false

