# =============================================================================
# Multi-Node Gemma 4 with RDMA (DGX GB10)
# =============================================================================
# Summary: Multi-node deployment for running google/gemma-4-26B-A4B-it across
# 2 DGX GB10 nodes with pipeline parallelism (PP=2) and RDMA interconnect.
# Targets full 262K context length. Enables tool-calling, reasoning parser,
# and fp8 KV cache. No autoscaling — 1 static replica. Includes NVNO RDMA
# shared device plugin config. Uses vllm:latest.
# =============================================================================

global:
  clusterDomain: cluster.local
  registry: docker.io
  imagePullPolicy: IfNotPresent
  labels:
    app.kubernetes.io/part-of: llmd-stack

# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: vllm/vllm-openai
    tag: latest
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
    GLOO_SOCKET_IFNAME: eth0
    NCCL_SOCKET_IFNAME: eth0
    UCX_NET_DEVICES: eth0
    OMPI_MCA_btl_tcp_if_include: eth0
    TP_SOCKET_IFNAME: eth0
    NCCL_IB_HCA: rocep1s0f0,roceP2p1s0f0    # both halves for full 200 Gb/s
    NCCL_IB_DISABLE: 0
    NCCL_IGNORE_CPU_AFFINITY: 1
    TORCH_DISTRIBUTED_DEBUG: INFO
    NCCL_DEBUG: INFO
    HF_XET_HIGH_PERFORMANCE: 1
  modelStorage:
    storageClass: ""
    #size: 100Gi
    mountPath: /root/.cache/huggingface
    # -- Host path for Hugging Face model cache.
    # Shares the host's ~/.cache/huggingface so models are downloaded once.
    # NOTE: Kubernetes does not expand ~ — use the absolute path, e.g.:
    #   /home/trevor/.cache/huggingface
    # or the Docker root:
    #   /root/.cache/huggingface
    hostPath: /home/trevor/.cache/huggingface

# =============================================================================
# Models — Multi-node with RDMA
# =============================================================================
models:
  - name: gemma-4-26b-a4b-it
    port: 8000
    model: google/gemma-4-26B-A4B-it
    nodes: 2
    tensorParallelSize: 1
    pipelineParallelSize: 2
    maxModelLen: 262144
    gpuMemoryUtilization: 0.5
    enabled: true
    resources:
      limits:
        cpu: "4"
        memory: "100Gi"
        nvidia.com/gpu: 1
        rdma/rdma_shared_device_a: "2"
      requests:
        cpu: "2"
        memory: "70Gi"
        nvidia.com/gpu: 1
        rdma/rdma_shared_device_a: "2"
    #nodeSelector:
    #  kubernetes.io/hostname: dgx-spark-1
    affinity: {}
    tolerations: []
    extraEnv: {}
    extraArgs:
      - "--max-num-seqs=4"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser=gemma4"
      - "--reasoning-parser=gemma4"
      - "--kv-cache-dtype=fp8"
      - "--max-num-batched-tokens=16384"
      - "--default-chat-template-kwargs={\"enable_thinking\": true}"
    replicas: 1

# =============================================================================
# NVIDIA Network Operator (NVNO) — RDMA Shared Device Plugin
# =============================================================================
nvno:
  rdmaSharedDevicePlugin:
    enabled: true
    config: |
      {
        "configList": [
          {
            "resourceName": "rdma_shared_device_a",
            "rdmaHcaMax": 63,
            "selectors": {
              "vendors": [],
              "deviceIDs": [],
              "drivers": [],
              "ifNames": ["enp1s0f0np0", "enP2p1s0f0np0"],
              "linkTypes": []
            }
          }
        ]
      }

