# =============================================================================
# Single-Node Smoketest with Istio Ingress + EPP Flow Control Scale-to-Zero
# =============================================================================
# Summary: Single-node deployment combining Istio Gateway for external ingress
# with the llm-d EPP (Endpoint Picker) for intelligent request routing and
# KEDA-based scale-to-zero autoscaling using EPP Flow Control metrics.
#
# Architecture:
#   External Client
#     → Istio Gateway (port 80)
#     → HTTPRoute
#     → LiteLLM Proxy
#     → llm-d EPP (Flow Control + request routing)
#     → vLLM (Qwen2.5-0.5B-Instruct)
#
# Autoscaling (llm-d recommended pattern):
#   KEDA ScaledObject monitors llm_d_epp_flow_control_queue_size via
#   Prometheus scaler. When queue depth > 0 (requests buffered at EPP),
#   KEDA scales the vLLM Deployment from 0 → N. The EPP's Flow Control
#   buffers incoming requests during cold starts — no 5xx errors.
#
# Prerequisites:
#   - KEDA installed: helm install keda kedacore/keda --namespace keda
#   - Prometheus stack scraping the llm-d EPP metrics
#   - Istio or any Gateway API-compatible ingress controller
#   - (Optional) Prometheus Adapter for HPA external metrics fallback
#
# No RDMA. Useful for testing the Istio ingress + EPP scale-to-zero path.
# =============================================================================

global:
  clusterDomain: cluster.local
  registry: docker.io
  imagePullPolicy: IfNotPresent
  labels:
    app.kubernetes.io/part-of: llmd-stack

# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: vllm/vllm-openai
    tag: latest
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
  modelStorage:
    storageClass: ""
    mountPath: /root/.cache/huggingface
    # -- Host path for Hugging Face model cache.
    # Shares the host's ~/.cache/huggingface so models are downloaded once.
    hostPath: /home/trevor/.cache/huggingface
  autoscaling:
    # -- Prometheus server address for KEDA Prometheus scaler.
    # Used when autoscaling.keda=true on individual models.
    prometheusServerAddress: "http://dev-kube-prometheus-stack-prometheus.llmd-stack.svc:9090"

# =============================================================================
# Models — Tiny model for EPP Flow Control scale-to-zero testing
# =============================================================================
models:
  - name: qwen-2-5-05b-it
    port: 8000
    model: Qwen/Qwen2.5-0.5B-Instruct
    nodes: 1
    tensorParallelSize: 1
    pipelineParallelSize: 1
    maxModelLen: 8192
    gpuMemoryUtilization: 0.1
    enabled: true
    resources:
      limits:
        cpu: "4"
        memory: "8Gi"
        nvidia.com/gpu: 1
      requests:
        cpu: "2"
        memory: "6Gi"
        nvidia.com/gpu: 1
    affinity: {}
    tolerations: []
    extraEnv: {}
    extraArgs:
      - "--max-num-seqs=4"
      - "--max-num-batched-tokens=8192"
      - "--enforce-eager" # Used for testing to keep VRAM down
    # -- Replicas omitted (null) so KEDA ScaledObject manages scale-to-zero.
    # The template omits the replicas field when autoscaling.keda=true AND
    # minReplicas=0, preventing the Deployment controller from fighting
    # with KEDA over the replica count.
    replicas: null
    # -- KEDA autoscaling via EPP Flow Control queue depth metric.
    # KEDA ScaledObject queries llm_d_epp_flow_control_queue_size from
    # Prometheus. When queue depth > 0, KEDA scales 0 → N.
    # The EPP's Flow Control buffers requests during cold starts.
    autoscaling:
      enabled: true
      keda: true
      # Scale-to-zero enabled with minReplicas: 0; KEDA ScaledObject managed; Expect long cold start times and a delayed first request. 
      # Set it to 1 to keep a hot instance running (comsumes VRAM and power)
      minReplicas: 0 
      maxReplicas: 8
      targetRequestsWaiting: "5"
      # -- HPA scaling behavior policies.
      # Controls how quickly replicas are added or removed to balance
      # responsiveness against stability.
      behavior:
        scaleUp:
          # -- How long to wait before acting on a scale-up recommendation.
          # Prevents flapping from transient metric spikes.
          stabilizationWindowSeconds: 30
          policies:
            # -- Add at most 1 Pod every 30s (conservative floor).
            - type: Pods
              value: 1
              periodSeconds: 30
          # -- Use the policy that yields the smaller change (Min = conservative).
          selectPolicy: Min
        scaleDown:
          # -- 5-minute cooldown before removing replicas.
          # Protects against premature scale-in during traffic dips.
          stabilizationWindowSeconds: 300
          policies:
            # -- Remove at most 50% of current replicas every 30s.
            - type: Percent
              value: 50
              periodSeconds: 30

servicemonitor:
  enabled: true

gateway:
  name: ""
  gatewayClassName: "istio"
  enabled: true
