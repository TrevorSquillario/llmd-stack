# =============================================================================
# Single-Node Smoketest with Istio Ingress
# =============================================================================
# Summary: Single-node deployment with Istio Gateway for external ingress.
# Runs Qwen2.5-0.5B-Instruct (1 replica, no autoscaling). Disables the
# llm-d router in favor of Istio-based routing. No RDMA. Useful for testing
# the Istio ingress path on a single DGX Spark node.
# =============================================================================

global:
  clusterDomain: cluster.local
  registry: docker.io
  imagePullPolicy: IfNotPresent
  labels:
    app.kubernetes.io/part-of: llmd-stack

# =============================================================================
# vLLM Backend Settings
# =============================================================================
vllm:
  image:
    repository: vllm/vllm-openai
    tag: latest
  extraEnv:
    VLLM_LOGGING_LEVEL: "INFO"
  modelStorage:
    storageClass: ""
    #size: 100Gi
    mountPath: /root/.cache/huggingface
    # -- Host path for Hugging Face model cache.
    # Shares the host's ~/.cache/huggingface so models are downloaded once.
    # NOTE: Kubernetes does not expand ~ — use the absolute path, e.g.:
    #   /home/trevor/.cache/huggingface
    # or the Docker root:
    #   /root/.cache/huggingface
    hostPath: /home/trevor/.cache/huggingface

# =============================================================================
# Models — Fit within 128GB Unified Memory per DGX Spark node
# =============================================================================
models:
  - name: qwen-2-5-05b-it
    port: 8000
    model: Qwen/Qwen2.5-0.5B-Instruct
    nodes: 1
    tensorParallelSize: 1
    pipelineParallelSize: 1
    maxModelLen: 8192
    gpuMemoryUtilization: 0.09
    enabled: true
    resources:
      limits:
        cpu: "4"
        memory: "8Gi"
        nvidia.com/gpu: 1
      requests:
        cpu: "2"
        memory: "6Gi"
        nvidia.com/gpu: 1
    affinity: {}
    tolerations: []
    extraEnv: {}
    extraArgs:
      - "--max-num-seqs=2"
      - "--max-num-batched-tokens=8192"
      - "--enforce-eager" # Used for testing to keep VRAM down
    replicas: 1

servicemonitor:
  enabled: true

llm-d-router-standalone:
  router:
    enabled: false

# ============================================================================
# Gateway — Istio Gateway resource for external ingress
# ============================================================================
gateway:
  # -- Name of the Gateway resource
  name: ""
  # -- Gateway class name (e.g. "istio")
  gatewayClassName: "istio"
  # -- Whether to create a Gateway resource
  enabled: true

